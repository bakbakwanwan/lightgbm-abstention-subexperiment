analysis:
  split_method_prefix: group_seed
  split_seeds: [43, 44, 45]
  reference_split_seed: 42
  test_fraction: 0.25
  stratify_column: Label
  decision_threshold: 0.5
  offline_target_abstention_rates: [0.01, 0.02, 0.05, 0.10]
  fixed_threshold_target_abstention_rates: [0.01, 0.05]
  aurc_shuffle_seeds: [101, 202, 303]

  reference_rank:
    method: group_seed42
    metric: aurc_random_ratio
    numerator_field: aurc
    denominator_field: random_aurc
    source: results/EXP-007/metrics.json

  rank_verdict:
    minimum_errors_per_seed: 10
    maximum_ratio_multiplier: 3.0
    maintained_pass_count: 3
    inconclusive_pass_count: 2
    failed_max_pass_count: 1
    unassessable_if_any_seed_below_minimum_errors: true

  fixed_threshold_source:
    method: group_seed42
    budget_field: target_abstention_rate
    threshold_field: confidence_threshold
    source: results/EXP-007/metrics.json

  throughput_verdict:
    allowed_rate_multiplier_lower: 0.95
    allowed_rate_multiplier_upper: 1.05
    per_seed:
      maintained_in_range_threshold_count: 2
      inconclusive_in_range_threshold_count: 1
      failed_in_range_threshold_count: 0
    aggregate:
      maintained_seed_count: 3
      failed_minimum_seed_count: 2
      otherwise: inconclusive

  class_overlap:
    include_in_primary: true
    exclusion_metrics_diagnostic_only: true

  technical_validity:
    invalidate_all_if_any_seed_invalid: true
    rerun_all_seeds_with_new_experiment_id: true

training:
  selection: fixed_from_exp007
  selected_candidate_id: C06
  num_boost_round: 230
  early_stopping: false
  calibration: none
  num_threads: 0
  fixed_parameters:
    boosting_type: gbdt
    objective: binary
    metric: binary_logloss
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 63
    min_data_in_leaf: 20
    feature_fraction: 1.0
    bagging_fraction: 1.0
    bagging_freq: 0
    max_bin: 255
    lambda_l1: 0.0
    lambda_l2: 1.0
    use_missing: true
    zero_as_missing: false
    deterministic: true
    force_col_wise: true
    seed: 42
    data_random_seed: 42
    feature_fraction_seed: 42
    bagging_seed: 42

execution_guard:
  require_clean_worktree: true
  refuse_existing_output: true
  run_tests_first: true
  test_command: [python, -m, pytest]
